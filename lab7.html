!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>use of rowspan</title>
</head>
<body>
<table  border="1">
	<tr>
<td rowspan="3">1</td>
<td>2</td><td>3</td>
	</tr>
	<tr>
<td>4</td>
<td>5</td>
	</tr>
	<tr>
<td>6</td><td>7</td>
	</tr>
	<tr>
<td>8</td><td>9</td>
	</tr>
</table>
</body>
</html>
